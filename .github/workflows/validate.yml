name: Validate PocketLedger

on:
  push:
    branches:
      - feature/supabase-auth-gate
  pull_request:
    branches:
      - main

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check direct local-first launch
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          const sw = fs.readFileSync('service-worker.js', 'utf8');
          const checks = [
            ['page does not require an authentication state', !html.includes('auth-pending')],
            ['app.js loads directly', html.includes('<script src="app.js"></script>')],
            ['Supabase auth gate is not loaded', !html.includes('auth.js')],
            ['service worker does not cache auth gate', !sw.includes('auth.js')],
            ['service worker cache version refreshed', sw.includes('pocketledger-v9')]
          ];
          for (const [label, ok] of checks) console.log(`${ok ? 'PASS' : 'FAIL'}: ${label}`);
          if (checks.some(([, ok]) => !ok)) process.exit(1);
          NODE

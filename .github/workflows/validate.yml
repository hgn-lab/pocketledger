name: Validate PocketLedger

on:
  push:
    branches:
      - main
      - feature/supabase-auth-gate
  pull_request:
    branches:
      - main

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run finance calculation tests
        run: npm test
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check direct launch and consolidated navigation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          const sw = fs.readFileSync('service-worker.js', 'utf8');
          const ids = [...html.matchAll(/id="([^"]+)"/g)].map(match => match[1]);
          const uniqueIds = new Set(ids);
          const checks = [
            ['app launches directly', html.includes('<body>') && html.includes('<script src="app.js"></script>')],
            ['authentication module removed from page', !html.includes('auth.js')],
            ['no duplicate HTML IDs', uniqueIds.size === ids.length],
            ['four bottom navigation tabs', (html.match(/class="nav-btn/g) || []).length === 4],
            ['analytics embedded in Home', html.indexOf('id="analyticsScreen"') < html.indexOf('<!-- BUDGET SCREEN -->')],
            ['accounts embedded in Settings', html.indexOf('id="accountsScreen"') > html.indexOf('id="settingsScreen"')],
            ['CSV export is only in Settings', html.indexOf('id="export"') > html.indexOf('id="settingsScreen"')],
            ['Settings has three segmented sections', ['accounts','cards','liabilities'].every(tab => html.includes('data-settings-tab="' + tab + '"'))],
            ['liabilities have their own list', html.includes('id="liabilityList"')],
            ['secure backup follows CSV export', html.indexOf('backup-section') > html.indexOf('id="export"')],
            ['service worker does not cache auth module', !sw.includes('"./auth.js"')],
            ['first-run terms dialog exists', html.includes('id="termsDialog"') && html.includes('id="termsConsent"')],
            ['terms acceptance gates database startup', fs.readFileSync('app.js', 'utf8').includes('await waitForTermsAcceptance()')],
            ['language selector is in Settings', html.includes('id="languageSelect"') && html.includes('data-settings-panel="accounts"')],
            ['language changes have explicit apply action', html.includes('id="applyLanguage"') && fs.readFileSync('app.js', 'utf8').includes('$("applyLanguage").addEventListener')],
            ['Indonesian localization covers core navigation', ['Beranda','Transaksi','Anggaran','Pengaturan'].every(label => fs.readFileSync('app.js', 'utf8').includes(label))],
            ['Indonesian localization includes budget, transaction and backup workflows', ['Simpan anggaran keseluruhan','Tambah transaksi','Buat cadangan terenkripsi'].every(label => fs.readFileSync('app.js', 'utf8').includes(label))],
            ['dynamic Indonesian count labels are supported', fs.readFileSync('app.js', 'utf8').includes('target aktif') && fs.readFileSync('app.js', 'utf8').includes('item')],
            ['first-run terms language selector exists', html.includes('id="termsLanguageSelect"') && fs.readFileSync('app.js', 'utf8').includes('$("termsLanguageSelect").addEventListener')],
            ['terms language follows saved app language', fs.readFileSync('app.js', 'utf8').includes('termsSelector.value = appLanguage')],
            ['terms acceptance version refreshed', fs.readFileSync('app.js', 'utf8').includes('pocketledgerTermsAccepted_v3')],
            ['terms can be reopened from Settings', html.includes('id="viewTerms"')],
            ['transaction search and filter controls exist', ['transactionSearch','transactionTypeFilter','transactionCategoryFilter','transactionAccountFilter','transactionDateFrom','transactionDateTo','transactionSort','clearTransactionFilters'].every(id => html.includes('id="' + id + '"'))],
            ['transaction filters include all sort modes', ['newest','oldest','highest','lowest'].every(value => html.includes('value="' + value + '"'))],
            ['transaction filters are wired to rendering', fs.readFileSync('app.js', 'utf8').includes('function transactionFilterRows') && fs.readFileSync('app.js', 'utf8').includes('clearTransactionFilters')],
            ['transaction account filter is populated from local accounts', fs.readFileSync('app.js', 'utf8').includes('async function populateTransactionAccountFilter')],
            ['transaction filters are collapsible and styled as compact card', html.includes('class="transaction-filter-card"') && css.includes('.transaction-filter-card>summary')],
            ['cream app background is configured', css.includes('background: #f3f0e8;')],
            ['transaction search remains visible outside collapsed filters', html.includes('class="transaction-search-card"') && html.indexOf('id="transactionSearch"') < html.indexOf('class="transaction-filter-card"')],
            ['secondary transaction filters are collapsed by default', html.includes('<details class="transaction-filter-card">') && !html.includes('<details open class="transaction-filter-card">')],
            ['date filters use constrained responsive widths', css.includes('.transaction-filters input[type="date"]') && css.includes('max-width:100%')],
            ['net worth history uses tested shared calculation', fs.readFileSync('finance-core.js', 'utf8').includes('function calculateNetWorthHistory') && fs.readFileSync('app.js', 'utf8').includes('PocketLedgerCore.calculateNetWorthHistory')],
            ['net worth breakdown and monthly movement are displayed', ['netWorthAssets','netWorthLiabilities','netWorthMonthlyChange'].every(id => html.includes('id="' + id + '"'))],
            ['net worth history tests cover opening dates and current cutoff', fs.readFileSync('tests/finance-core.test.js', 'utf8').includes('net worth history reconstructs assets, liabilities') && fs.readFileSync('tests/finance-core.test.js', 'utf8').includes('excludes activity before opening')],
            ['service worker cache version refreshed', sw.includes('pocketledger-v52')]
          ];
          for (const [label, ok] of checks) console.log((ok ? 'PASS: ' : 'FAIL: ') + label);
          if (checks.some(([, ok]) => !ok)) process.exit(1);
          NODE
